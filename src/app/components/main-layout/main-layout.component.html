<!-- src/app/components/main-layout/main-layout.component.html -->
<div class="main-layout" *ngIf="currentUser">
  <div class="mobile-header">
    <button class="menu-toggle" (click)="toggleMobileMenu()">☰</button>
    <div class="mobile-title">ChatApp</div>
    <div class="mobile-user">{{ currentUser.displayName }}</div>
  </div>

  <aside class="sidebar-nav" [class.mobile-open]="mobileMenuOpen">
    <div class="nav-header">
      <h2>ChatApp</h2>
      <div
        class="user-info"
        (click)="navigateTo('/profile')"
        style="cursor: pointer"
      >
        <div class="user-avatar">
          <img
            *ngIf="currentUser.profilePhotoUrl"
            [src]="currentUser.profilePhotoUrl"
            [alt]="currentUser.displayName"
            class="avatar-image"
            (error)="onImageError($event)"
          />
          <span *ngIf="!currentUser.profilePhotoUrl" class="avatar-initials">
            {{ getInitials(currentUser.displayName) }}
          </span>
        </div>
        <div class="user-details">
          <div class="user-name">{{ currentUser.displayName }}</div>
          <div class="user-status">🟢 Online</div>
        </div>
      </div>
    </div>

    <nav class="nav-menu">
      <!-- Chats -->
      <button
        class="nav-item"
        [class.active]="isActive('/chat')"
        (click)="navigateTo('/chat')"
      >
        <img src="/images/Chat.png" alt="Chats" class="nav-icon" />
        <span>Chats</span>
      </button>

      <!-- Friends -->
      <button
        class="nav-item"
        [class.active]="isActive('/friends')"
        (click)="navigateTo('/friends')"
      >
        <img src="/images/Friends.png" alt="Friends" class="nav-icon" />
        <span>Friends</span>
      </button>

      <!-- Calls -->
      <button
        class="nav-item"
        [class.active]="isActive('/calls')"
        (click)="navigateTo('/calls')"
      >
        <svg
          class="nav-icon nav-icon-svg"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.27-.27.67-.36
               1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45
               1-1 1C9.61 21 3 14.39 3 6c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1
               0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.01L6.6 10.8z"
            fill="currentColor"
          />
        </svg>
        <span>Calls</span>
      </button>
    </nav>

    <div class="nav-footer">
      <button class="logout-btn" (click)="logout()">
        <img src="/images/logout.png" alt="Logout" class="nav-icon" />
      </button>
    </div>
  </aside>

  <div class="main-content" (click)="closeMobileMenu()">
    <router-outlet></router-outlet>
  </div>

  <div
    class="mobile-overlay"
    [class.active]="mobileMenuOpen"
    (click)="closeMobileMenu()"
  ></div>
</div>
